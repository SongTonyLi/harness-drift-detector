[project]
name = "harness-drift-detector"
version = "0.1.0"
description = "Fast drift hotspotting for coding-agent harness transcripts"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Song", email = "sl5807@columbia.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "zstandard>=0.25.0",
]

[project.scripts]
hdd = "harness_drift_detector.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lefthook>=2.1.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: hits the TypeSafe API; needs TYPESAFE_API_KEY",
  "integration: needs every workstream implemented",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "reports", ".hdd-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: frozen-dataclass defaults such as `options: DetectOptions = DetectOptions()` are immutable.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test data and expected strings read better unwrapped.
"tests/**" = ["E501"]
