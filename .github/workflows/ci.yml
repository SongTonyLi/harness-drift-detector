name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Run gates
        run: uv run python scripts/gates.py ci

      - name: Commit messages carry no tool attribution
        if: github.event_name == 'pull_request'
        run: uv run python scripts/verify_commit_message.py --range "origin/${{ github.base_ref }}..HEAD"
